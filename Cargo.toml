[package]
name = "file-converter"
version = "0.1.1"
edition = "2021"
description = "Convert files from your file manager's context menu (Rust port of Tichau/FileConverter)"
license = "GPL-3.0-or-later"
repository = "https://github.com/elsamrafisptr/file-converter-rs"

[package.metadata.deb]
maintainer = "Elsam Rafi Saputra <134671598+elsamrafisptr@users.noreply.github.com>"
section = "utils"
depends = "$auto, ffmpeg, imagemagick | graphicsmagick-imagemagick-compat, ghostscript"
suggests = "libreoffice-writer, libreoffice-calc, libreoffice-impress"
extended-description = "Right-click files in Dolphin or Nautilus to convert video, audio, images, PDFs and documents with presets (Rust port of Tichau/FileConverter)."
maintainer-scripts = "packaging/linux/debian/"
assets = [
    ["target/release/file-converter", "usr/bin/", "755"],
    ["packaging/linux/file-converter.desktop", "usr/share/applications/", "644"],
    ["packaging/icons/file-converter.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["packaging/icons/file-converter.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["README.md", "usr/share/doc/file-converter/", "644"],
]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8", features = ["preserve_order"] }
dirs = "5"
shlex = "1"
indicatif = "0.17"
# OpenGL (glow) instead of the wgpu/Vulkan default: same look, much less memory and binary size.
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "system_fonts",
    "wayland",
    "x11",
] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4"

# eframe's `winit/default` (dropped with its default features): Wayland loaded at runtime, GNOME window decorations.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
winit = "0.30"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
strip = true
lto = true
