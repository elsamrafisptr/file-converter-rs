[package]
name = "file-converter"
version = "0.1.0"
edition = "2021"
description = "Convert files from your file manager's context menu (Rust port of Tichau/FileConverter)"
license = "GPL-3.0-or-later"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8", features = ["preserve_order"] }
dirs = "5"
shlex = "1"
indicatif = "0.17"
eframe = "0.37"

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
strip = true
lto = true
